<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Date Range Picker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!--
    Everything the dashboard zone holds. The bar is also the readout of the
    active range, so the range stays on screen without a separate worksheet.
    The calendar opens in a Tableau dialog; see picker.html.
  -->
  <div class="drp-bar" id="bar">
    <select class="drp-bar__preset" id="barPreset" aria-label="Quick ranges"></select>

    <button class="drp-bar__open" type="button" id="barOpen">
      <svg class="drp-bar__icon" viewBox="0 0 16 16" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.4">
        <rect x="1.7" y="3" width="12.6" height="11.3" rx="1.6"/>
        <path d="M1.7 6.6h12.6M5 1.6v2.6M11 1.6v2.6"/>
      </svg>
      <span class="drp-bar__range" id="barRange">&mdash;</span>
      <span class="drp-bar__caret" aria-hidden="true">&#9662;</span>
    </button>

    <span class="drp-bar__status" id="barStatus"></span>
  </div>

  <div class="drp-notice drp-notice--error" id="setupNotice" hidden>
    <p id="setupNoticeText"></p>
    <p><button class="drp-btn" type="button" id="setupConfigureBtn">Open configuration</button></p>
  </div>

  <script src="lib/tableau.extensions.1.latest.js"></script>
  <script src="js/dateutil.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/tableau-bridge.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
